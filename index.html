<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HANAKO</title>
  <style>
    :root {
      --bg-0: #fffafb;
      --bg-1: #fff4f7;
      --bg-2: #ffeef4;
      --text: rgba(52, 48, 51, 0.92);
      --muted: rgba(92, 86, 90, 0.7);
      --glass: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.92);
      --glow: rgba(244, 166, 198, 0.42);
      --overlay: rgba(255, 246, 249, 0.56);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Ensure the canvas doesn't interfere with touch events */
    #liquid-background-canvas {
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: transparent;
      overflow-x: hidden;
      cursor: default;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(120% 120% at 10% 10%, rgba(255, 231, 241, 0.25) 0%, transparent 38%),
                  radial-gradient(100% 100% at 90% 80%, rgba(255, 225, 236, 0.2) 0%, transparent 44%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      z-index: 2;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(219, 169, 189, 0.25) 0 0.7px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(219, 169, 189, 0.2) 0 0.7px, transparent 1px);
      background-size: 3px 3px, 4px 4px;
      mix-blend-mode: soft-light;
    }

    .water-bg-iframe {
      display: none;
    }

    .page {
      position: relative;
      z-index: 20;
      min-height: 100vh;
      padding: clamp(2rem, 4vw, 3.5rem);
      pointer-events: none;
    }

    .page * {
      pointer-events: auto;
    }

    .pin-spacer {
      pointer-events: none !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2rem;
      margin-bottom: clamp(2rem, 5vw, 4rem);
    }

    .title {
      font-size: clamp(1.6rem, 2.6vw, 2.6rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-wrap: balance;
    }

    .subtitle {
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: clamp(0.9rem, 1.2vw, 1rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hint {
      color: rgba(110, 101, 107, 0.72);
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.9;
    }

    .timeline-viewport {
      position: relative;
      width: 100%;
      height: min(72vh, 640px);
      overflow: hidden;
      border-radius: 2rem;
      pointer-events: none;
    }

    .timeline-track {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translate3d(0, -50%, 0);
      display: flex;
      align-items: center;
      gap: clamp(1.2rem, 2.2vw, 2.6rem);
      will-change: transform;
      padding: 1rem 14vw 1rem 6vw;
      pointer-events: none;
    }

    .project-card {
      position: relative;
      flex: 0 0 clamp(260px, 28vw, 390px);
      height: clamp(340px, 56vh, 500px);
      border-radius: 1.3rem;
      padding: 1.2rem 1.25rem 1.3rem;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.76), rgba(255, 238, 244, 0.62));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 48px rgba(194, 145, 166, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.72);
      pointer-events: auto;
      transform-origin: center center;
      will-change: transform, opacity, filter;
      overflow: hidden;
      cursor: pointer;
      isolation: isolate;
    }

    .project-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      background: radial-gradient(220px 220px at 50% 20%, rgba(255, 184, 212, 0.56), transparent 65%);
      transition: opacity 0.45s ease;
    }

    .project-card:hover::before {
      opacity: 0.75;
    }

    .project-card:hover {
      box-shadow: 0 24px 62px rgba(188, 132, 156, 0.24), 0 0 32px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.88);
    }

    /* 卡片 hover 时给整张卡片挂上 SVG 水面扭曲滤镜
       —— 图片、文字、相框边一起扭曲，整张卡像浸在水里
       !important 是为了覆盖 GSAP 在 inline style 上写的 filter: blur(0px) */
    .project-card:hover {
      filter: url(#water-ripple) !important;
    }

    .project-thumb {
      position: relative;
      width: 100%;
      height: 58%;
      border-radius: 1rem;
      overflow: hidden;
      margin-bottom: 1.1rem;
      background: linear-gradient(135deg, rgba(255, 206, 222, 0.68), rgba(255, 237, 244, 0.42));
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .project-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(188, 136, 158, 0.28) 100%);
    }

    .project-thumb .noise {
      position: absolute;
      inset: 0;
      opacity: 0.2;
      mix-blend-mode: soft-light;
      background-image:
        radial-gradient(circle at 20% 25%, rgba(255, 255, 255, 0.28) 0 1px, transparent 1.2px),
        radial-gradient(circle at 75% 70%, rgba(255, 255, 255, 0.2) 0 1px, transparent 1.2px);
      background-size: 5px 5px, 4px 4px;
    }

    .project-meta {
      position: relative;
      z-index: 1;
    }

    .project-year {
      color: rgba(108, 99, 105, 0.7);
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }

    .project-title {
      font-size: clamp(1.02rem, 1.6vw, 1.28rem);
      font-weight: 600;
      margin-bottom: 0.55rem;
      letter-spacing: 0.02em;
    }

    .project-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(78, 72, 76, 0.84);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── 打开状态：meta 区可滚动，文字渐显 ── */
    .focus-card {
      display: flex;
      flex-direction: column;
    }

    .focus-card .project-thumb {
      flex-shrink: 0;
    }

    .focus-card .project-meta {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      mask-image: linear-gradient(to bottom, transparent, black 10%, black 74%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 74%, transparent 100%);
    }

    .focus-card .project-meta::-webkit-scrollbar {
      display: none;
    }

    .focus-card .project-desc {
      display: block;
      overflow: visible;
      white-space: pre-wrap;
    }

    /* content 富文本排版 */
    .focus-card .project-desc h3,
    .focus-card .project-desc h4 {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin: 0.9rem 0 0.3rem;
      color: rgba(60, 52, 58, 0.9);
    }
    .focus-card .project-desc p {
      margin: 0.3rem 0 0.5rem;
    }
    .focus-card .project-desc ul,
    .focus-card .project-desc ol {
      padding-left: 1.1rem;
      margin: 0.3rem 0 0.5rem;
    }
    .focus-card .project-desc li {
      margin-bottom: 0.25rem;
    }
    .focus-card .project-desc hr {
      border: none;
      border-top: 1px solid rgba(194, 145, 166, 0.3);
      margin: 0.8rem 0;
    }
    .focus-card .project-desc strong { font-weight: 600; }
    .focus-card .project-desc em     { font-style: italic; opacity: 0.85; }

    /* ── 底部容器：装 nav 和独立的 jump 胶囊 ── */
    .timeline-bottom {
      position: fixed;
      left: 50%;
      bottom: clamp(1.2rem, 2.4vw, 2rem);
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      pointer-events: none; /* 子元素再启用 */
    }

    /* nav 和 jump 共享的毛玻璃胶囊外观 */
    .timeline-nav,
    .timeline-nav-jump {
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 238, 244, 0.6));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(194, 145, 166, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.78);
      pointer-events: auto;
      user-select: none;
    }

    .timeline-nav {
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(.2,.8,.2,1);
    }

    /* jump 胶囊：相对窄，内容居中 */
    .timeline-nav-jump {
      padding: 0.75rem 1.1rem;
      display: flex;
      align-items: center;
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(.2,.8,.2,1);
    }

    .timeline-nav.is-hidden {
      opacity: 0;
      transform: translateY(24px);
      pointer-events: none;
    }

    .timeline-nav-track {
      position: relative;
      width: clamp(220px, 38vw, 460px);
      height: 18px;
      display: flex;
      align-items: center;
    }

    /* 背景轨道线 */
    .timeline-nav-track::before {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(219, 169, 189, 0.25), rgba(219, 169, 189, 0.18));
      border-radius: 2px;
    }

    /* 进度填充线（left / width 由 JS 按可见首尾节点真实位置动态设置） */
    .timeline-nav-fill {
      position: absolute;
      left: 0;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      width: 0;
      background: linear-gradient(90deg, rgba(244, 166, 198, 0.95), rgba(255, 197, 220, 0.95));
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(244, 166, 198, 0.55);
      transition: width 0.18s ease-out, left 0.18s ease-out;
    }

    .timeline-nav-nodes {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-nav-node {
      position: relative;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid rgba(219, 169, 189, 0.55);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                  background 0.3s ease,
                  border-color 0.3s ease,
                  box-shadow 0.35s ease;
      flex-shrink: 0;
    }

    .timeline-nav-node:hover {
      transform: scale(1.35);
      border-color: rgba(244, 166, 198, 0.9);
      box-shadow: 0 0 12px rgba(244, 166, 198, 0.55);
    }

    /* 已经路过的节点 */
    .timeline-nav-node.is-passed {
      background: rgba(244, 166, 198, 0.85);
      border-color: rgba(244, 166, 198, 0.9);
    }

    /* 当前激活节点 */
    .timeline-nav-node.is-active {
      transform: scale(1.55);
      background: #fff;
      border-color: rgba(244, 166, 198, 1);
      box-shadow: 0 0 0 4px rgba(244, 166, 198, 0.28),
                  0 0 18px rgba(244, 166, 198, 0.7);
    }

    /* 节点上方的 tooltip */
    .timeline-nav-node::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 14px);
      transform: translateX(-50%) translateY(6px);
      padding: 0.35rem 0.65rem;
      border-radius: 0.55rem;
      background: rgba(48, 38, 44, 0.86);
      color: #fff;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.35s cubic-bezier(.2,.8,.2,1);
      backdrop-filter: blur(8px);
    }

    .timeline-nav-node:hover::after,
    .timeline-nav-node.is-active::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 节点编号 / 进度文字 —— 可点击跳转 */
    .timeline-nav-count {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: rgba(110, 92, 102, 0.78);
      font-variant-numeric: tabular-nums;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .timeline-nav-count:hover {
      color: rgba(244, 144, 184, 1);
    }

    /* 数字 b 元素 = 滚动数字的裁剪容器 */
    .timeline-nav-count b {
      font-weight: 600;
      color: rgba(244, 144, 184, 0.95);
      display: inline-block;
      vertical-align: middle;
      min-width: 1em;
      height: 1em;
      line-height: 1;
      position: relative;
      overflow: hidden;
      text-align: center;
      transition: min-width 0.25s ease; /* 1→10 时宽度过渡 */
    }

    /* hover 时给整个 count 加点点下划线作为可点击提示 */
    .timeline-nav-count:hover {
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 4px;
    }

    /* 每个数字 cell：默认占据容器整个区域，动画前后位置由 transform 决定 */
    .timeline-nav-count b .num-cell {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      text-align: center;
      line-height: 1;
    }

    /* 新数字 pop 出来：从 scale(0) 用 back-out 弹回 scale(1)，过冲一点点 */
    .timeline-nav-count b .num-cell.popping-in {
      animation: num-pop-in 0.42s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }
    /* 旧数字快速缩小消失 */
    .timeline-nav-count b .num-cell.popping-out {
      animation: num-pop-out 0.18s ease-in forwards;
    }

    @keyframes num-pop-in {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes num-pop-out {
      from { transform: scale(1); opacity: 1; }
      to   { transform: scale(0); opacity: 0; }
    }

    /* ── 跳转弹窗 ── */
    .jump-modal {
      position: fixed;
      inset: 0;
      z-index: 1500; /* 高于 focus-card (1200)，确保始终最上层 */
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .jump-modal.is-open {
      pointer-events: auto;
      opacity: 1;
    }

    /* 全屏背景：毛玻璃模糊整个页面 */
    .jump-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(255, 246, 249, 0.32);
      backdrop-filter: blur(22px) saturate(120%);
      -webkit-backdrop-filter: blur(22px) saturate(120%);
    }

    /* 弹窗本体：毛玻璃 + 弹跳出场 */
    .jump-modal-panel {
      position: relative;
      padding: 1.7rem 2.1rem 1.5rem;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(255, 238, 244, 0.72));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 28px 72px rgba(194, 145, 166, 0.36),
        0 0 80px var(--glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      text-align: center;
      min-width: 280px;
      transform: scale(0.7) translateY(20px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(.34, 1.56, .64, 1),
                  opacity 0.32s ease;
    }
    .jump-modal.is-open .jump-modal-panel {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .jump-modal-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: rgba(60, 52, 58, 0.92);
      margin: 0 0 0.35rem;
      letter-spacing: 0.04em;
    }
    .jump-modal-hint {
      font-size: 0.74rem;
      color: rgba(110, 92, 102, 0.7);
      letter-spacing: 0.06em;
      margin: 0 0 0.95rem;
    }
    .jump-modal-input {
      width: 6em;
      padding: 0.5em 0.3em;
      border: 1.5px solid rgba(244, 166, 198, 0.6);
      border-radius: 0.65em;
      background: rgba(255, 255, 255, 0.88);
      color: rgba(244, 144, 184, 1);
      font-weight: 600;
      font-size: 1.5rem;
      text-align: center;
      outline: none;
      letter-spacing: 0.05em;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .jump-modal-input::-webkit-outer-spin-button,
    .jump-modal-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .jump-modal-input:focus {
      border-color: rgba(244, 144, 184, 1);
      box-shadow: 0 0 0 4px rgba(244, 166, 198, 0.28);
    }
    .jump-modal-hint-bottom {
      margin: 0.9rem 0 0;
      font-size: 0.66rem;
      color: rgba(110, 92, 102, 0.55);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .jump-modal-panel {
        padding: 1.4rem 1.6rem 1.2rem;
        min-width: 240px;
      }
      .jump-modal-input { font-size: 1.3rem; }
    }

    /* ── 樱花花瓣（关闭帖子时爆散用） ── */
    .sakura-petal {
      position: fixed;
      width: 18px;
      height: 22px;
      /* 花瓣形状：左上尖、右下圆，像一片心叶 */
      border-radius: 100% 0 80% 0;
      background: radial-gradient(
        ellipse at 30% 30%,
        rgba(255, 255, 255, 0.95),
        rgba(255, 196, 214, 0.92) 55%,
        rgba(255, 138, 168, 0.88) 100%
      );
      box-shadow:
        0 2px 6px rgba(255, 170, 200, 0.35),
        inset -1px -1px 3px rgba(255, 140, 175, 0.3);
      pointer-events: none;
      z-index: 1100;
      will-change: transform, opacity;
      transform-origin: 50% 50%;
    }
    /* 几种色彩变体 —— 通过 nth-child 风格不好做，改为内联类区分 */
    .sakura-petal.tone-2 {
      background: radial-gradient(
        ellipse at 30% 30%,
        rgba(255, 245, 250, 0.95),
        rgba(255, 215, 230, 0.9) 55%,
        rgba(255, 165, 190, 0.82) 100%
      );
    }
    .sakura-petal.tone-3 {
      background: radial-gradient(
        ellipse at 30% 30%,
        rgba(255, 255, 255, 0.96),
        rgba(255, 230, 235, 0.92) 50%,
        rgba(255, 188, 196, 0.86) 100%
      );
    }
    /* 爆散瞬间从球心向外的柔光环 */
    .sakura-burst {
      position: fixed;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 220, 232, 0.75),
        rgba(255, 190, 210, 0.4) 50%,
        rgba(255, 190, 210, 0) 100%
      );
      pointer-events: none;
      z-index: 1099;
      transform: translate(-50%, -50%) scale(0.3);
      will-change: transform, opacity;
    }

    @media (max-width: 640px) {
      .timeline-bottom {
        bottom: 0.9rem;
        gap: 0.5rem;
      }
      .timeline-nav { padding: 0.55rem 1rem; }
      .timeline-nav-jump { padding: 0.55rem 0.85rem; }
      .timeline-nav-track { width: clamp(180px, 60vw, 320px); }
      .timeline-nav-node::after { font-size: 0.66rem; }
      .timeline-nav-count { font-size: 0.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .timeline-nav,
      .timeline-nav-jump,
      .timeline-nav-fill,
      .timeline-nav-node,
      .timeline-nav-node::after,
      .jump-modal,
      .jump-modal-panel {
        transition: none !important;
      }
      .timeline-nav-count b .num-cell.popping-in,
      .timeline-nav-count b .num-cell.popping-out {
        animation: none !important;
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      z-index: 80;
    }

    .focus-aura {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 360px;
      height: 460px;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      border-radius: 2rem;
      transform: translate3d(-50%, -50%, 0) scale(0.9);
      background:
        radial-gradient(45% 55% at 50% 40%, rgba(255, 255, 255, 0.72), transparent 70%),
        radial-gradient(70% 75% at 50% 60%, rgba(255, 188, 216, 0.48), rgba(255, 205, 226, 0.06) 72%);
      filter: blur(28px);

    .focus-card {

    /* ── 右侧内容面板 ── */
    .content-panel {
      position: fixed;
      z-index: 1200;

    .content-scroll-wrapper::-webkit-scrollbar { display: none; }

    /* 每个段落独立过渡，JS 会动态写入 filter + opacity */
    .content-scroll-wrapper p,
    .content-scroll-wrapper h3,
    .content-scroll-wrapper h4,
    .content-scroll-wrapper ul,
    .content-scroll-wrapper ol,

    .content-panel h3,
    .content-panel h4 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin: 1.1rem 0 0.4rem;

    .content-panel p  { margin: 0.5rem 0 0.7rem; white-space: pre-wrap; }
    .content-panel ul,
    .content-panel ol { padding-left: 1.3rem; margin: 0.5rem 0 0.7rem; white-space: normal; }
    .content-panel li { margin-bottom: 0.35rem; }
    .content-panel hr { border: none; border-top: 1px solid rgba(194,145,166,0.3); margin: 0.8rem 0; }
    .content-panel strong { font-weight: 600; }
    .content-panel em    { font-style: italic; opacity: 0.85; }
    .content-panel strong { font-weight: 600; }
    .content-panel em    { font-style: italic; opacity: 0.85; }

    /* 内容面板中的图片和视频 */
    .content-scroll-wrapper img,
    .content-scroll-wrapper video {
      display: block;
      max-width: 100%;
      max-height: 280px;
      height: auto;
      border-radius: 1rem;
      margin: 0.8rem 0;

    .content-scroll-wrapper img:hover {

    /* 图片放大查看器 */
    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 9999;

    .image-viewer-backdrop {

    .image-viewer-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      z-index: 1;
      transform: scale(0.85);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

    .image-viewer.active .image-viewer-content {

    .image-viewer-content img {
      display: block;
      max-width: 100%;
      max-height: 90vh;

      border-radius: 1.2rem;
      box-shadow:
        0 48px 96px rgba(188, 132, 156, 0.4),

    .image-viewer-close {
      position: absolute;
      top: -48px;

    .image-viewer-close::before,

      height: 2px;

    }

    .image-viewer-close::after {
      transform: rotate(-45deg);

<body>

        <feDisplacementMap id="ripple-disp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>

  <script>

    // 根据数据渲染卡片到 timeline-track，同时生成底部时间轴节点
    const track = document.getElementById("timelineTrack");
    const navNodesEl = document.getElementById("timelineNavNodes");
    const navFillEl = document.getElementById("timelineNavFill");
    const navCountEl = document.getElementById("timelineNavCount");
    const navEl = document.getElementById("timelineNav");

    document.getElementById("mobilePostCount").textContent = `共 ${PROJECTS.length} 篇`;

    // 一次显示的节点数（窗口大小）
    const NAV_WINDOW = 5;

    PROJECTS.forEach((p, i) => {
      const thumbInner = p.image
        ? `<img src="${p.image}" alt="${p.title}" loading="${window.HanakoMobile.media.matches && i > 0 ? "lazy" : "eager"}" decoding="async" style="width:100%;height:100%;object-fit:cover;">`
        : `<div class="noise"></div>`;
      track.insertAdjacentHTML("beforeend", `
        <article class="project-card" data-depth="${p.depth}" data-index="${i}" role="button" tabindex="0" aria-labelledby="postTitle${i}">
          <div class="project-thumb">${thumbInner}</div>
          <div class="project-meta">
            <p class="project-year">${p.year} · ${p.tag}</p>
            <h2 class="project-title" id="postTitle${i}">${p.title}</h2>
            <p class="project-desc">${p.desc}</p>
            <div class="mobile-only mobile-card-footer" aria-hidden="true"><span class="mobile-card-number">DIARY / ${String(i + 1).padStart(2, "0")}</span><span>阅读日记<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></div>
          </div>
        </article>
      `);

      // 底部时间轴节点
      const node = document.createElement("button");
      node.type = "button";
      node.className = "timeline-nav-node";
      node.dataset.index = String(i);
      node.dataset.label = p.title || `#${i + 1}`;
      node.setAttribute("aria-label", `跳转到 ${p.title || "项目 " + (i + 1)}`);
      navNodesEl.appendChild(node);
    });

    const navNodes = Array.from(navNodesEl.querySelectorAll(".timeline-nav-node"));
    navCountEl.innerHTML = `<b><span class="num-cell">1</span></b>`;

    function mountDesktopTimeline() {
      const events = new AbortController();
      const disposeCallbacks = [];
      let parallaxFrame = 0;
      let imageViewerTimer = 0;
      const listen = (target, type, handler, options = {}) =>
        target.addEventListener(type, handler, { ...options, signal: events.signal });
      gsap.registerPlugin(ScrollTrigger);
      navCountEl.innerHTML = '<b><span class="num-cell">1</span></b>';

    // ── 卡片 hover 水面扭曲（SVG feTurbulence + feDisplacementMap） ──
    // hover 触发 CSS filter: url(#water-ripple) 接管渲染
    // JS 做两件事：
    //   ① GSAP 缓动 feDisplacementMap.scale 0 ↔ TARGET，扭曲幅度由轻到重渐进入场
    //   ② 持续摆动 baseFrequency，水面在流动而不是静止扭曲
    (function setupWaterRipple() {
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      const turb = document.getElementById("ripple-turb");
      const disp = document.getElementById("ripple-disp");
      if (!turb || !disp) return;

      const TARGET_SCALE = 18;   // hover 时最终扭曲幅度
      const RAMP_IN = 0.4;       // 进入扭曲耗时（s）—— 由慢到快入水，但快速到位
      const RAMP_OUT = 0.3;      // 退出扭曲耗时（s）—— 快速归零

      let hoverCount = 0;
      let rafId = null;
      let t = 0;
      disposeCallbacks.push(() => { cancelAnimationFrame(rafId); gsap.killTweensOf(disp); disp.setAttribute("scale", "0"); });

      function flowTick() {
        if (hoverCount === 0) {
          rafId = null;
          return;
        }
        // 噪声主频率围绕 0.014/0.020 缓慢摆动 → 水面纹理柔和流动
        t += 0.012;
        const fx = (0.014 + Math.sin(t) * 0.005).toFixed(4);
        const fy = (0.020 + Math.cos(t * 0.8) * 0.005).toFixed(4);
        turb.setAttribute("baseFrequency", fx + " " + fy);
        rafId = requestAnimationFrame(flowTick);
      }

      document.querySelectorAll(".project-card").forEach(cardEl => {
        listen(cardEl, "mouseenter", () => {
          hoverCount++;
          if (!rafId) rafId = requestAnimationFrame(flowTick);
          // 扭曲幅度缓动入场：从当前值（通常 0，或上次未完成的中间值）→ TARGET
          // power2.in：起步慢，越往后越快 → "渐渐入水"的感觉
          gsap.to(disp, {
            attr: { scale: TARGET_SCALE },
            duration: RAMP_IN,
            ease: "power2.in",
            overwrite: true
          });
        });
        listen(cardEl, "mouseleave", () => {
          hoverCount = Math.max(0, hoverCount - 1);
          // 扭曲幅度缓动退场：→ 0
          // power2.out：开始快、收尾慢 → 自然消退
          gsap.to(disp, {
            attr: { scale: 0 },
            duration: RAMP_OUT,
            ease: "power2.out",
            overwrite: true
          });
        });
      });
    })();


    const viewport = document.getElementById("timelineViewport");
    const overlay = document.getElementById("overlay");
    const focusAura = document.getElementById("focusAura");
    const cards = gsap.utils.toArray(".project-card");

    // 图片查看器元素
    const imageViewer = document.getElementById("imageViewer");
    const imageViewerImg = document.getElementById("imageViewerImg");
    const imageViewerBackdrop = document.getElementById("imageViewerBackdrop");
    const imageViewerClose = document.getElementById("imageViewerClose");

    let activeCard = null;
    let activeFocusCard = null;
    let activeContentPanel = null;
    let activeArticleNavigation = null;
    let activeArticleMusic = null;
    let canParallax = true;
    let pointerX = window.innerWidth * 0.5;
    let pointerY = window.innerHeight * 0.5;
    let smoothX = pointerX;
    let smoothY = pointerY;
    let scrollTween = null;
    let activeSnapshot = null;

    const cardStates = cards.map((card, i) => ({
      card,
      baseY: i % 2 ? -18 - i * 2 : 14 + i * 2,
      baseRotate: i % 2 ? 2.2 : -2.2,
      depth: Number(card.dataset.depth) || 1
    }));
    const parallaxSetters = cardStates.map(state => ({
      x: gsap.quickTo(state.card, "xPercent", { duration: 0.85, ease: "power3.out" }),
      y: gsap.quickTo(state.card, "yPercent", { duration: 0.85, ease: "power3.out" })
    }));

    // ── 图片查看器功能 ──
    function openImageViewer(imgSrc) {
      clearTimeout(imageViewerTimer);
      imageViewerImg.src = imgSrc;
      imageViewer.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeImageViewer() {
      imageViewer.classList.remove("active");
      document.body.style.overflow = activeCard ? "hidden" : "";
      clearTimeout(imageViewerTimer);
      imageViewerTimer = setTimeout(() => {
        imageViewerImg.src = "";
      }, 400);
    }

    listen(imageViewerBackdrop, "click", closeImageViewer);
    listen(imageViewerClose, "click", closeImageViewer);

    // 初始化卡片轻微错位堆叠，建立层级感
    function layoutCards() {
      cardStates.forEach((state, i) => {
        gsap.set(state.card, {
          y: state.baseY,
          rotation: state.baseRotate,
          zIndex: cards.length - i
        });
      });
    }

    // ── 底部时间轴导航：分页窗口 + 进度联动 + 节点点击跳转 ──
    let currentNavIndex = 0;
    let navWindowStart = -1; // 当前窗口起始节点 index

    // 窗口跟随当前激活节点：只显示窗口内的 W 个节点，其余隐藏
    function updateNavWindow(activeIdx) {
      const N = navNodes.length;
      if (!N) return;
      const W = Math.min(NAV_WINDOW, N);
      // activeIdx 尽量居中，首尾不越界
      let start = activeIdx - Math.floor((W - 1) / 2);
      start = Math.max(0, Math.min(N - W, start));
      if (start === navWindowStart) return; // 窗口未变化，跳过 DOM 操作
      navWindowStart = start;
      navNodes.forEach((node, i) => {
        node.style.display = (i >= start && i < start + W) ? "" : "none";
      });
    }

    function updateTimelineNav(progress) {
      // progress: 0~1
      const N = navNodes.length;
      if (!N) return;
      const p = Math.max(0, Math.min(1, progress));

      // 找到最接近的节点作为当前激活
      const idx = N === 1 ? 0 : Math.round(p * (N - 1));
      const clamped = Math.max(0, Math.min(N - 1, idx));

      // 先更新窗口（隐藏/显示节点），再算 fill 位置（基于可见节点的实际 offsetLeft）
      updateNavWindow(clamped);

      navNodes.forEach((node, i) => {
        node.classList.toggle("is-active", i === clamped);
        node.classList.toggle("is-passed", i < clamped);
      });

      // 进度填充：用可见首节点和当前激活节点的真实中心位置
      // 当前激活节点一定在可见窗口内（由 updateNavWindow 保证）
      const visibleFirst = navNodes.find(n => n.style.display !== "none");
      const activeNode = navNodes[clamped];
      if (visibleFirst && activeNode) {
        const startX = visibleFirst.offsetLeft + visibleFirst.offsetWidth / 2;
        const activeX = activeNode.offsetLeft + activeNode.offsetWidth / 2;
        navFillEl.style.left = startX + "px";
        navFillEl.style.width = Math.max(0, activeX - startX) + "px";
      } else {
        navFillEl.style.width = "0px";
      }

      if (clamped !== currentNavIndex) {
        currentNavIndex = clamped;
        pulseNavCountTo(clamped + 1);
      }
    }

    // 系统"减少动画"偏好检测（pop 动画和弹窗都会用到）
    const prefersReducedMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function pulseNavCountTo(newNum) {
      const b = navCountEl.querySelector("b");
      if (!b) {
        // b 不在了（比如编辑中），直接重渲染
        navCountEl.innerHTML = `<b><span class="num-cell">${newNum}</span></b>`;
        return;
      }
      // 找到当前展示的数字（不在退出状态的最新 cell）
      const liveCells = b.querySelectorAll(".num-cell:not(.popping-out)");
      const lastCell = liveCells[liveCells.length - 1];
      if (!lastCell) {
        b.innerHTML = `<span class="num-cell">${newNum}</span>`;
        return;
      }
      if (lastCell.textContent === String(newNum)) return;

      // 减少动画偏好：直接换文字，不堆积 DOM
      if (prefersReducedMotion) {
        lastCell.textContent = String(newNum);
        return;
      }

      // 旧 cell 快速缩小消失，结束后从 DOM 移除
      lastCell.classList.add("popping-out");
      listen(lastCell,
        "animationend",
        () => { lastCell.remove(); },
        { once: true }
      );

      // 新 cell 从 scale(0) 弹出
      const newCell = document.createElement("span");
      newCell.className = "num-cell popping-in";
      newCell.textContent = String(newNum);
      b.appendChild(newCell);

      // 动画结束后清理 class，避免重播
      listen(newCell,
        "animationend",
        () => { newCell.classList.remove("popping-in"); },
        { once: true }
      );
    }

    // 初始化窗口（如果节点数 > 5，先隐藏多余的）
    updateNavWindow(0);

    // 跳转到第 i 张卡片：直接设置 window 滚动位置，ScrollTrigger 的 scrub 会平滑过渡
    function jumpToIndex(i) {
      if (!scrollTween || !scrollTween.scrollTrigger) return;
      const N = navNodes.length;
      if (N <= 1) return;
      const clamped = Math.max(0, Math.min(N - 1, i));
      const targetProgress = clamped / (N - 1);
      const st = scrollTween.scrollTrigger;
      const targetScroll = st.start + targetProgress * (st.end - st.start);
      window.scrollTo({ top: targetScroll, behavior: "smooth" });
    }

    // 节点点击事件
    navNodes.forEach(node => {
      listen(node, "click", e => {
        e.stopPropagation();
        if (activeCard) closeCard();
        jumpToIndex(parseInt(node.dataset.index, 10));
      });
    });

    // ── 点击底部数字 → 弹出跳转 Modal ──
    const jumpModal = document.getElementById("jumpModal");
    const jumpModalBackdrop = document.getElementById("jumpModalBackdrop");
    const jumpModalInput = document.getElementById("jumpModalInput");
    navCountEl.title = "点击跳转到指定帖子";

    function isJumpModalOpen() {
      return jumpModal.classList.contains("is-open");
    }

    function openJumpModal() {
      const N = navNodes.length;
      if (N <= 1) return;
      jumpModalInput.max = N;
      jumpModalInput.value = "";
      jumpModalInput.placeholder = String(currentNavIndex + 1);
      jumpModal.classList.add("is-open");
      jumpModal.setAttribute("aria-hidden", "false");
      // 等弹窗动画起势后聚焦（用 RAF 嵌套确保 focus 不被浏览器忽略）
      requestAnimationFrame(() => requestAnimationFrame(() => {
        jumpModalInput.focus();
      }));
    }

    function closeJumpModal() {
      if (!isJumpModalOpen()) return;
      jumpModal.classList.remove("is-open");
      jumpModal.setAttribute("aria-hidden", "true");
      jumpModalInput.blur();
    }

    function commitJumpModal() {
      const N = navNodes.length;
      const val = parseInt(jumpModalInput.value, 10);
      const valid = !isNaN(val) && val >= 1 && val <= N;
      closeJumpModal();
      if (valid) {
        if (activeCard) closeCard();
        jumpToIndex(val - 1);
      }
    }

    listen(navCountEl, "click", openJumpModal);
    listen(jumpModalBackdrop, "click", closeJumpModal);
    // 输入框内的按键直接处理，阻止冒泡到全局 keydown
    listen(jumpModalInput, "keydown", e => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); commitJumpModal(); }
      else if (e.key === "Escape") { e.preventDefault(); closeJumpModal(); }
    });
    // 阻止 panel 上的点击穿透到 backdrop
    listen(document.querySelector(".jump-modal-panel"), "click", e => e.stopPropagation());

    // 通过 ScrollTrigger 将纵向滚动映射为横向时间线移动
    function buildScroll() {
      if (scrollTween) {
        scrollTween.scrollTrigger.kill();
        scrollTween.kill();
      }

      const totalMove = Math.max(track.scrollWidth - viewport.clientWidth + window.innerWidth * 0.08, 0);
      const totalScroll = Math.max(totalMove + window.innerHeight * 0.9, window.innerHeight);
      const segment = 0.9;
      const timelineDuration = (cards.length - 1) * segment + segment * 2;

      const hasTouchScreen = "ontouchstart" in window;
      scrollTween = gsap.timeline({
        scrollTrigger: {
          trigger: viewport,
          start: "top top",
          end: () => "+=" + totalScroll,
          scrub: hasTouchScreen ? 0.6 : 1,
          pin: true,
          anticipatePin: 1,
          invalidateOnRefresh: true,
          normalizeScroll: hasTouchScreen ? { allowNestedScroll: true, type: "touch" } : false,
          onUpdate: self => updateTimelineNav(self.progress)
        }
      });

      scrollTween.to(track, { x: -totalMove, duration: timelineDuration, ease: "none" }, 0);

      cards.forEach((card, i) => {
        const enterAt = i * segment;
        const leaveAt = enterAt + segment;

        scrollTween.fromTo(
          card,
          {
            opacity: i === 0 ? 1 : 0.12,
            scale: i === 0 ? 1 : 0.92,
            x: i === 0 ? 0 : 90,
            filter: i === 0 ? "blur(0px)" : "blur(8px)"
          },
          {
            opacity: 1,
            scale: 1,
            x: 0,
            filter: "blur(0px)",
            duration: segment,
            ease: "power3.out",
            immediateRender: false
          },
          enterAt
        );

        scrollTween.to(
          card,
          {
            opacity: 0.35,
            scale: 0.93,
            x: -60,
            duration: segment,
            ease: "power4.out"
          },
          leaveAt
        );
      });
    }

    function pointerMove(e) {
      pointerX = e.clientX;
      pointerY = e.clientY;
    }

    // 鼠标位置驱动惯性视差，不同深度对应不同位移幅度
    function renderParallax() {
      smoothX += (pointerX - smoothX) * 0.08;
      smoothY += (pointerY - smoothY) * 0.08;

      if (canParallax) {
        const cx = window.innerWidth * 0.5;
        const cy = window.innerHeight * 0.5;
        const nx = (smoothX - cx) / cx;
        const ny = (smoothY - cy) / cy;

        cardStates.forEach((state, i) => {
          const driftX = nx * 15 * state.depth;
          const driftY = ny * 10 * state.depth;
          parallaxSetters[i].x(driftX);
          parallaxSetters[i].y(driftY);
        });
      }

      parallaxFrame = requestAnimationFrame(renderParallax);
    }

    function closeCard() {
      if (!activeCard || !activeFocusCard) {
        return;
      }

      const card = activeCard;
      const focusCardEl = activeFocusCard;
      const contentPanel = activeContentPanel;
      const saved = activeSnapshot;
      const sourceRect = card.getBoundingClientRect();
      if (activeArticleNavigation) activeArticleNavigation.destroy();
      activeArticleNavigation = null;
      if (activeArticleMusic) activeArticleMusic.destroy();
      activeArticleMusic = null;
      gsap.killTweensOf(focusCardEl);
      activeCard = null;
      activeFocusCard = null;
      activeContentPanel = null;
      activeSnapshot = null;
      canParallax = true;
      document.body.style.overflow = "";

      gsap.to(overlay, {
        opacity: 0,
        duration: 0.45,
        ease: "power3.out",
        onComplete: () => {
          overlay.style.pointerEvents = "none";
        }
      });

      gsap.to(focusAura, {
        opacity: 0,
        scale: 0.9,
        duration: 0.45,
        ease: "power3.out"
      });

      // 右侧内容面板：跟着圆球化的节奏，先收缩再淡出（提前于掉落完成）
      if (contentPanel) {
        gsap.killTweensOf(contentPanel);
        contentPanel.querySelectorAll("video").forEach(v => v.pause());
        gsap.to(contentPanel, {
          scale: 0.7,
          opacity: 0,
          x: "+=20",
          duration: 0.35,
          ease: "power2.in",
          onComplete: () => contentPanel.remove()
        });
      }

      // ── 关闭动画：圆球化 → 重力掉落 ──
      // 策略：放弃"回到原位"的轨迹追踪。卡片整体坍缩成一个圆球，受重力坠出屏幕
      // 用户视线跟着球向下出框，根本不会注意到原卡片在自己位置淡入承接

      const focusRect = focusCardEl.getBoundingClientRect();
      const focusW = focusRect.width;
      const focusH = focusRect.height;
      // 圆球更小：从最短边的 0.4 倍开始（之前是 0.62）
      const targetSize = Math.min(focusW, focusH) * 0.4;
      const compensateX = (focusW - targetSize) / 2;
      const compensateY = (focusH - targetSize) / 2;

      // overflow:hidden + transform-origin 居中，准备做形变
      gsap.set(focusCardEl, { overflow: "hidden", transformOrigin: "50% 50%" });

      // 全克隆卡片（带文字、meta）时，先把非缩略图部分淡出，避免圆形化时露出文字残角
      const nonThumbParts = focusCardEl.querySelectorAll(
        ".project-year, .project-title, .project-day, .project-meta, .project-desc"
      );
      if (nonThumbParts.length > 0) {
        gsap.to(nonThumbParts, {
          opacity: 0,
          duration: 0.15,
          ease: "power2.in"
        });
      }

      const tl = gsap.timeline({
        onComplete: () => {
          focusCardEl.remove();
          gsap.set(card, {
            x: saved ? saved.x : 0,
            y: saved ? saved.y : 0,
            scale: saved ? saved.scale : 1,
            rotation: saved ? saved.rotation : 0,
            xPercent: saved ? saved.xPercent : 0,
            yPercent: saved ? saved.yPercent : 0,
            filter: saved ? saved.filter : "blur(0px)",
            opacity: 1
          });
          card.classList.remove("is-active");
        }
      });

      // ① 圆球化 + 缩小 —— width/height 同步到 targetSize，border-radius → 50%
      //    x/y 平移补偿，保持视觉中心不变（图片保持清晰，缩小节奏更快）
      tl.to(focusCardEl, {
        width: targetSize,
        height: targetSize,
        borderRadius: "50%",
        x: `+=${compensateX}`,
        y: `+=${compensateY}`,
        duration: 0.26,
        ease: "power3.out"
      }, 0);

      // ② 果冻弹跳 wobble —— 落定到爆散之间插入两段不对称形变
      //    scaleX:1.22, scaleY:0.82 —— 横向被压扁（圆变椭圆）
      tl.to(focusCardEl, {
        scaleX: 1.22,
        scaleY: 0.82,
        duration: 0.09,
        ease: "power2.out"
      }, 0.24);

      // ③ 反弹拉长 —— 纵向胖、横向瘦
      tl.to(focusCardEl, {
        scaleX: 0.85,
        scaleY: 1.15,
        duration: 0.09,
        ease: "power2.inOut"
      }, 0.33);

      // ④ 收回圆形 —— 准备好爆散
      tl.to(focusCardEl, {
        scaleX: 1,
        scaleY: 1,
        duration: 0.06,
        ease: "power2.out"
      }, 0.42);

      // ⑤ 圆球爆散成樱花花瓣
      //    球本身：迅速塌缩 + 透明，0.18s 内消失
      //    同时：在球心释放 18 片花瓣 + 一个柔光环，花瓣四散飘飞下坠
      tl.to(focusCardEl, {
        scaleX: 0.4,
        scaleY: 0.4,
        opacity: 0,
        duration: 0.18,
        ease: "power2.in",
        onStart: () => {
          const r = focusCardEl.getBoundingClientRect();
          spawnSakuraBurst(r.left + r.width / 2, r.top + r.height / 2);
        }
      }, 0.48);

      // 原卡片在自己原位淡入，跟圆球化并行
      gsap.set(card, { opacity: 0 });
      card.classList.remove("is-active");
      tl.to(card, {
        opacity: 1,
        duration: 0.38,
        ease: "power2.out"
      }, 0.18);
    }

    // ── 樱花爆散：在 (cx, cy) 释放一团花瓣 + 一个柔光环 ──
    function spawnSakuraBurst(cx, cy) {
      // ① 柔光环：从一点放大并淡出，强化"爆散瞬间"的视觉锚点
      const burst = document.createElement("div");
      burst.className = "sakura-burst";
      burst.style.left = cx + "px";
      burst.style.top = cy + "px";
      document.body.appendChild(burst);
      gsap.fromTo(burst,
        { scale: 0.3, opacity: 0.9 },
        {
          scale: 3.2,
          opacity: 0,
          duration: 0.7,
          ease: "power2.out",
          onComplete: () => burst.remove()
        }
      );

      // ② 18 片花瓣：随机角度爆出 → 随机方向飘飞下坠 → 旋转 → 淡出
      const NUM_PETALS = 18;
      const tones = ["", "tone-2", "tone-3"];
      for (let i = 0; i < NUM_PETALS; i++) {
        const petal = document.createElement("div");
        petal.className = "sakura-petal";
        const tone = tones[Math.floor(Math.random() * tones.length)];
        if (tone) petal.classList.add(tone);

        // 大小略有差异，更自然
        const size = 14 + Math.random() * 10;
        petal.style.width = size + "px";
        petal.style.height = (size * 1.22) + "px";
        petal.style.left = (cx - size / 2) + "px";
        petal.style.top = (cy - size * 0.6) + "px";

        // 初始就给一个随机的自身旋转，避免所有花瓣一样朝向
        const initRot = Math.random() * 360;

        document.body.appendChild(petal);

        // 爆散角度：基本环形展开 + 抖动；初始爆发距离 60~120px
        const angle = (i / NUM_PETALS) * Math.PI * 2 + (Math.random() - 0.5) * 0.7;
        const burstDist = 60 + Math.random() * 70;
        // 横向飘移方向 + 振幅（下落过程中左右摇摆的总位移）
        const drift = (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 90);
        // 下落总距离 —— 全部飞出屏幕下方
        const fall = window.innerHeight * 0.55 + Math.random() * 280;
        // 累计旋转量：自旋多圈，方向随机
        const totalRot = initRot + (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 540);
        // 爆发时长 / 飘落时长 都加随机
        const burstDur = 0.28 + Math.random() * 0.12;
        const fallDur = 0.95 + Math.random() * 0.55;
        const finalScale = 0.45 + Math.random() * 0.25;

        // 初始爆发偏向上半圆，让花瓣更多向外、向上一点（更有"炸开"感）
        const burstX = Math.cos(angle) * burstDist;
        const burstY = Math.sin(angle) * burstDist * 0.55 - 12;

        // 用 timeline 串两段：先爆出，再飘落
        const petalTl = gsap.timeline({
          onComplete: () => petal.remove()
        });

        gsap.set(petal, { rotation: initRot });

        petalTl.to(petal, {
          x: burstX,
          y: burstY,
          rotation: initRot + (Math.random() - 0.5) * 90,
          duration: burstDur,
          ease: "power2.out"
        });

        petalTl.to(petal, {
          x: `+=${drift}`,
          y: `+=${fall}`,
          rotation: totalRot,
          scale: finalScale,
          opacity: 0,
          duration: fallDur,
          ease: "power1.in"
        });
      }
    }

    // 点击卡片时聚焦并居中，再次点击或点遮罩关闭
    function focusCard(card) {
      if (activeCard === card) {
        closeCard();
        return;
      }

      if (activeCard && activeCard !== card) {
        closeCard();
      }

      canParallax = false;
      activeCard = card;
      card.classList.add("is-active");
      document.body.style.overflow = "hidden";

      overlay.style.pointerEvents = "auto";
      gsap.to(overlay, {
        opacity: 1,
        duration: 0.5,
        ease: "power4.out"
      });

      const rect = card.getBoundingClientRect();
      const cardCenterX = rect.left + rect.width * 0.5;
      const cardCenterY = rect.top + rect.height * 0.5;
      const centerY = window.innerHeight * 0.5;

      const proj = PROJECTS[parseInt(card.dataset.index)];
      const hasTwoPanel = !!(proj && proj.content);
      const isMobile = "ontouchstart" in window && window.innerWidth <= 860;
      const gap = isMobile ? 12 : 28;

      // 放大打开的帖子尺寸
      const scaleFactor = isMobile ? 1 : 1.35;
      let focusW = rect.width * scaleFactor;
      let focusH = rect.height * scaleFactor;

      // 有 content 时左移，否则居中；移动端整体左移，保持左右卡片原本间距
      const mobileLeftOffset = isMobile && hasTwoPanel ? window.innerWidth * 0.06 : 0;
      // 有内容时，图片和面板紧挨着，没有间隙
      const panelGap = hasTwoPanel ? 0 : gap;
      const targetCenterX = hasTwoPanel
        ? window.innerWidth * 0.5 - focusW * 0.5 - panelGap * 0.5 - mobileLeftOffset
        : window.innerWidth * 0.5;
      const offsetX = targetCenterX - cardCenterX;
      const offsetY = centerY - cardCenterY;
      const auraWidth = focusW * 1.36;
      const auraHeight = focusH * 1.42;

      // 有内容面板时，计算整体布局（图片+面板）
      let finalImageWidth, finalPanelWidth, imageX, panelX;
      if (hasTwoPanel) {
        const totalWidth = focusW * 2; // 图片+面板总宽度
        const availableWidth = window.innerWidth * 0.85; // 可用宽度
        const scale = Math.min(1, availableWidth / totalWidth);
        finalImageWidth = focusW * scale;
        finalPanelWidth = focusW * scale;

        // 整体居中布局
        const totalLayoutWidth = finalImageWidth + finalPanelWidth;
        const layoutStartX = (window.innerWidth - totalLayoutWidth) / 2;
        imageX = layoutStartX;
        panelX = layoutStartX + finalImageWidth;
      } else {
        finalImageWidth = focusW;
        finalPanelWidth = focusW;
        imageX = targetCenterX;
        panelX = 0; // 不使用
      }

      let focusCardEl;
      if (hasTwoPanel && proj.image) {
        // 有内容时，左边只显示图片
        focusCardEl = document.createElement("div");
        focusCardEl.className = "focus-card focus-image-only";
        focusCardEl.innerHTML = `<img src="${proj.image}" alt="${proj.title}" style="width:100%;height:100%;object-fit:cover;">`;
        document.body.appendChild(focusCardEl);
      } else {
        focusCardEl = card.cloneNode(true);
        focusCardEl.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        focusCardEl.removeAttribute('aria-labelledby');
        focusCardEl.setAttribute('aria-label', proj.title);
        focusCardEl.classList.remove("is-active");
        focusCardEl.classList.add("focus-card");
        document.body.appendChild(focusCardEl);
      }

      activeFocusCard = focusCardEl;
      activeArticleMusic = HanakoMusic.createPlayer({
        host: focusCardEl.querySelector(".project-thumb") || focusCardEl,
        post: proj
      });
      listen(focusCardEl, "click", e => {
        e.stopPropagation();
        closeCard();
      });

      gsap.set(focusCardEl, {
        left: rect.left,
        top: rect.top,
        width: rect.width,
        height: rect.height,
        x: 0,
        y: 0,
        scale: 1,
        rotation: 0,
        xPercent: 0,
        yPercent: 0,
        opacity: 1,
        filter: "blur(0px)",
        zIndex: 1200
      });

      activeSnapshot = {
        rectLeft: rect.left,
        rectTop: rect.top,
        x: Number(gsap.getProperty(card, "x")) || 0,
        y: Number(gsap.getProperty(card, "y")) || 0,
        scale: Number(gsap.getProperty(card, "scale")) || 1,
        rotation: Number(gsap.getProperty(card, "rotation")) || 0,
        xPercent: Number(gsap.getProperty(card, "xPercent")) || 0,
        yPercent: Number(gsap.getProperty(card, "yPercent")) || 0,
        filter: gsap.getProperty(card, "filter") || "blur(0px)"
      };

      gsap.set(focusAura, { width: auraWidth, height: auraHeight, x: 0, y: 0 });
      gsap.to(focusAura, { opacity: 0.92, scale: 1.08, duration: 0.7, ease: "power4.out" });

      // 计算图片的y偏移，使其与面板垂直居中对齐
      const focusCardYOffset = centerY - focusH * 0.5 - rect.top;

      // 有内容面板时，使用计算好的位置
      const finalImageX = hasTwoPanel ? imageX - rect.left : offsetX;

      gsap.to(focusCardEl, {
        x: finalImageX,
        y: focusCardYOffset,
        width: finalImageWidth,
        height: focusH,
        scale: 1,
        filter: "blur(0px)",
        duration: 0.8,
        ease: "expo.out"
      });

      // 右侧内容面板
      if (hasTwoPanel) {
        const panel = document.createElement("div");
        panel.className = "content-panel";

        const scrollWrapper = document.createElement("div");
        scrollWrapper.className = "content-scroll-wrapper";

        // 每行都是独立的 <p>，保证上下边缘总有元素可以模糊
        scrollWrapper.innerHTML = proj.content
          .split(/\n/)
          .filter(s => s.trim())
          .map(s => /^<[a-z]/i.test(s.trim()) ? s.trim() : `<p>${s.trim()}</p>`)
          .join("");

        panel.appendChild(scrollWrapper);
        document.body.appendChild(panel);
        activeContentPanel = panel;

        // 计算每个块级元素的模糊/透明度
        const FADE = 110;   // 上下各 110px 的渐变区
        const MAX_BLUR = 25;
        function updateBlur() {
          const wrapRect = scrollWrapper.getBoundingClientRect();
          const H = wrapRect.height;
          const fadeDistance = Math.min(FADE, H * 0.25);
          const scrolled = scrollWrapper.scrollTop > 5; // 滚动超过5px才启用顶部模糊
          scrollWrapper.querySelectorAll(".article-toc, p, h1, h2, h3, h4, h5, h6, ul, ol, hr, img, video").forEach(el => {
            if (el.closest(".article-toc") && !el.classList.contains("article-toc")) return;
            const r = el.getBoundingClientRect();
            const top = r.top - wrapRect.top;
            const bot = r.bottom - wrapRect.top;
            let t = 1; // 0=完全模糊, 1=完全清晰
            if (bot < 0 || top > H) {
              t = 0;
            } else if (el.classList.contains("toc-target") && top >= 0 && bot <= H) {
              t = 1;
            } else if (top > H - fadeDistance) {
              t = Math.max(0, (H - top) / fadeDistance);
            } else if (scrolled && bot < fadeDistance) {
              t = Math.max(0, bot / fadeDistance);
            }
            el.style.filter  = t < 0.99 ? `blur(${(MAX_BLUR * (1 - t)).toFixed(2)}px)` : "";
            el.style.opacity = t < 0.99 ? (0.15 + 0.85 * t).toFixed(3) : "";
          });
        }

        // 视频自动播放/暂停：可见 >30% 时播放，否则暂停
        function updateVideoPlayback() {
          scrollWrapper.querySelectorAll("video").forEach(vid => {
            const wrapRect = scrollWrapper.getBoundingClientRect();
            const r = vid.getBoundingClientRect();
            const top = r.top - wrapRect.top;
            const bot = r.bottom - wrapRect.top;
            const H = wrapRect.height;
            const visibleTop = Math.max(top, 0);
            const visibleBot = Math.min(bot, H);
            const visibleFraction = bot > top ? (visibleBot - visibleTop) / (bot - top) : 0;
            if (visibleFraction > 0.3) {
              if (vid.paused) vid.play().catch(() => {});
            } else {
              if (!vid.paused) vid.pause();
            }
          });
        }

        // 右侧面板紧跟左侧图片，紧挨着，整体一起左移
        const panelLeft = hasTwoPanel ? panelX : (window.innerWidth * 0.5 + panelGap * 0.5 - mobileLeftOffset);
        const panelW = isMobile
          ? Math.min(window.innerWidth - panelLeft - 8, focusW * 1.4)
          : finalPanelWidth;

        gsap.set(panel, {
          left: panelLeft,
          top: centerY - focusH * 0.5,
          width: panelW,
          height: focusH,
          scale: 0.82,
          opacity: 0,
          y: 32,
          zIndex: 1200
        });

        const articleNavigation = createArticleNavigation({
          panel,
          scrollWrapper,
          onUpdate: () => { updateBlur(); updateVideoPlayback(); }
        });
        activeArticleNavigation = articleNavigation;

        gsap.to(panel, {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.72,
          delay: 0.18,
          ease: "back.out(1.9)",
          onUpdate: articleNavigation.refresh,
          onComplete: articleNavigation.refresh
        });

        listen(panel, "click", e => e.stopPropagation());

        // 为面板中的图片添加点击放大功能
        listen(panel, "click", e => {
          if (e.target.tagName === "IMG" && e.target.closest(".content-scroll-wrapper")) {
            e.stopPropagation();
            openImageViewer(e.target.src);
          }
        });

      } else {
        // 无 content 时，焦点卡片内部可滚动
        listen(focusCardEl, "wheel", e => {
          const meta = focusCardEl.querySelector(".project-meta");
          if (meta) { e.preventDefault(); e.stopPropagation(); meta.scrollTop += e.deltaY; }
        }, { passive: false });
      }
    }

    cards.forEach(card => {
      listen(card, "keydown", event => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); focusCard(card); }
      });
      listen(card, "click", e => {
        e.stopPropagation();
        focusCard(card);
      });
    });

    listen(overlay, "click", closeCard);

    listen(window, "pointermove", pointerMove, { passive: true });
    let lastDesktopWidth = window.innerWidth;
    listen(window, "resize", () => {
      if (window.HanakoMobile.media.matches) return;
      if (window.innerWidth !== lastDesktopWidth) {
        lastDesktopWidth = window.innerWidth;
        layoutCards();
        buildScroll();
      }
      ScrollTrigger.refresh();
      // 宽度变了，nav 填充也要重算
      if (scrollTween && scrollTween.scrollTrigger) {
        updateTimelineNav(scrollTween.scrollTrigger.progress);
      }
    });

    // ── 移动端触摸：左右滑动驱动时间线 ──
    (function initTouchSwipe() {
      if (!("ontouchstart" in window)) return;

      let touchStartX = 0, touchStartY = 0, locked = null;
      let velocity = 0, rafTick = null, lastMoveTime = 0;
      disposeCallbacks.push(() => cancelAnimationFrame(rafTick));

      listen(viewport, "touchstart", e => {
        if (activeCard) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        locked = null;
        velocity = 0;
        if (rafTick) { cancelAnimationFrame(rafTick); rafTick = null; }
      }, { passive: true });

      listen(viewport, "touchmove", e => {
        if (activeCard) return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;

        if (locked === null) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          locked = Math.abs(dx) >= Math.abs(dy) ? "h" : "v";
        }
        if (locked !== "h") return;

        e.preventDefault();
        const now = Date.now();
        const delta = -(t.clientX - touchStartX);
        velocity = delta / Math.max(now - lastMoveTime, 8);
        lastMoveTime = now;

        window.scrollBy(0, delta * 2.5);
        touchStartX = t.clientX;
        touchStartY = t.clientY;
      }, { passive: false });

      // 惯性滑动
      listen(viewport, "touchend", () => {
        if (locked !== "h") return;
        let v = velocity * 12;
        function inertia() {
          if (Math.abs(v) < 0.3) return;
          window.scrollBy(0, v);
          v *= 0.92;
          rafTick = requestAnimationFrame(inertia);
        }
        rafTick = requestAnimationFrame(inertia);
      }, { passive: true });
    })();

    layoutCards();
    buildScroll();
    updateTimelineNav(0); // 初始激活第一个节点
    renderParallax();

    // 键盘导航：Esc 关闭，←/→ 上一张/下一张，Home/End 首尾
    listen(window, "keydown", e => {
      if (e.key === "Escape") {
        // Esc 关闭优先级：跳转弹窗 > 图片查看器 > 卡片详情
        if (isJumpModalOpen()) {
          closeJumpModal();
        } else if (imageViewer.classList.contains("active")) {
          closeImageViewer();
        } else {
          closeCard();
        }
        return;
      }

      // 弹窗 / 图片查看器 / 输入框打开时，不响应方向键
      if (isJumpModalOpen()) return;
      if (imageViewer.classList.contains("active")) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;

      // 方向键导航：如果打开了卡片，先关闭再跳转
      if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End") {
        e.preventDefault();
        if (activeCard) closeCard();

        let nextIdx = currentNavIndex;
        if (e.key === "ArrowLeft")  nextIdx = currentNavIndex - 1;
        if (e.key === "ArrowRight") nextIdx = currentNavIndex + 1;
        if (e.key === "Home")       nextIdx = 0;
        if (e.key === "End")        nextIdx = navNodes.length - 1;
        jumpToIndex(nextIdx);
      }
    });

      // Release desktop effects when the viewport switches to the touch layout.
      window.focusCard = focusCard;
      window.closeCard = closeCard;
      return () => {
        events.abort();
        clearTimeout(imageViewerTimer);
        cancelAnimationFrame(parallaxFrame);
        disposeCallbacks.forEach(dispose => dispose());
        activeArticleNavigation?.destroy();
        activeArticleMusic?.destroy();
        scrollTween?.scrollTrigger?.kill();
        scrollTween?.kill();
        const transient = Array.from(document.querySelectorAll('.focus-card, .content-panel, .sakura-petal, .sakura-burst'));
        transient.forEach(node => {
          node.querySelectorAll('video, audio').forEach(media => media.pause());
          gsap.killTweensOf([node, ...node.querySelectorAll('*')]);
          node.remove();
        });
        gsap.killTweensOf([track, ...cards, overlay, focusAura]);
        gsap.set([track, ...cards, overlay, focusAura], { clearProps: 'all' });
        cards.forEach(card => card.classList.remove('is-active'));
        imageViewer.classList.remove('active');
        imageViewerImg.removeAttribute('src');
        jumpModal.classList.remove('is-open');
        jumpModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        delete window.focusCard;
        delete window.closeCard;
      };
    }

    let animationLibraries;
    function loadDesktopAnimation() {
      if (animationLibraries) return animationLibraries;
      const loadScript = src => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Unable to load desktop animation'));
        document.head.appendChild(script);
      });
      animationLibraries = loadScript('https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js')
        .then(() => loadScript('https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js'));
      return animationLibraries;
    }

    let disposeLayout = null;
    let layoutGeneration = 0;
    function mountCurrentLayout() {
      const generation = ++layoutGeneration;
      disposeLayout?.();
      disposeLayout = null;
      const mobile = window.HanakoMobile.media.matches;
      document.documentElement.classList.toggle('is-mobile', mobile);
      if (mobile) {
        disposeLayout = window.HanakoMobile.mount(PROJECTS);
        return;
      }
      loadDesktopAnimation().then(() => {
        if (generation !== layoutGeneration) return;
        disposeLayout = mountDesktopTimeline();
      }).catch(error => {
        if (generation !== layoutGeneration) return;
        console.warn('Desktop animation unavailable; using the reading layout.', error);
        document.documentElement.classList.add('is-mobile');
        disposeLayout = window.HanakoMobile.mount(PROJECTS);
      });
    }
    window.HanakoMobile.media.addEventListener('change', mountCurrentLayout);
    mountCurrentLayout();
  </script>
</body>
</html>
